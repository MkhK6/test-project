services:
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        PHP_IMAGE_TAG: ${PHP_IMAGE_TAG}
        COMPOSER_IMAGE_TAG: ${COMPOSER_IMAGE_TAG}
        MLOCATI_INSTALLER_IMAGE_TAG: ${MLOCATI_INSTALLER_IMAGE_TAG}
    container_name: ${COMPOSE_PROJECT_NAME}-php-fpm
    working_dir: /var/www/html
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - laravel

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-testing-db.sh:/docker-entrypoint-initdb.d/02-init-testing-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - laravel

  nginx:
    image: nginx:${NGINX_IMAGE_TAG}
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT}:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - laravel

volumes:
  postgres_data:

networks:
  laravel:
    driver: bridge
